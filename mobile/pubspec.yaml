name: aegis_console
description: "Aegis: el asistente personal, en el bolsillo. Cliente del bridge."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# El `+N` es el `versionCode`, y **no es decorativo**: Android solo acepta
# actualizar una app si el `versionCode` nuevo es mayor o igual que el instalado.
# Es lo que lee el bridge con `aapt` para saber si hay versión nueva, y lo que
# lee la app sobre sí misma para decirselo. Subirlo es parte de publicar.
version: 1.0.13+14

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # `web_socket_channel` se quitó con el motor de Hermes: el WS `/ws` era de su
  # run y ya no existe. Nadie lo importaba —`AppConfig.wsBase` sí, y eso era
  # configuración muerta— y una dependencia sin usar paga en el APK y en cada
  # `pub get`.
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  # Resolver el bridge por mDNS, para no depender de que la IP de la casa no
  # cambie. Viene del propio Flutter (`flutter/core-packages`), no es un
  # paquete de terceros: eso importa porque lo que entra aquí va a leer la red
  # de la casa y a decirnos dónde está el bridge.
  #
  # ## Por qué una dependencia y no el announcement de Android
  # El `NsdManager` del sistema está atado a un `Context` y a callbacks del
  # sistema, y en un proceso de Flutter hay que montar los dos y traducirlos.
  # Además devuelve los servicios **ya filtrados** por tipo, lo que quita
  # justamente el paso que hace falta: comprobar que la respuesta es del
  # bridge y no de otra cosa que se anuncie en la red.
  multicast_dns: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Iconos del lanzador, generados desde `assets/brand/derivados/`.
  #
  # Se generan en vez de escribir los PNG a mano por dos cosas: las densidades se
  # calculan en vez de adivinarse, y sobre todo aparece el **ícono adaptativo**
  # (`mipmap-anydpi-v26`). Sin él, Android aplica su máscara a un cuadrado
  # heredado y el resultado se ve recortado (A-024).
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # No hay sección `assets:` a propósito. El glifo de la marca se pinta en vivo
  # con `CustomPaint` (`lib/core/widgets/aegis_mark.dart`), así que en el APK no
  # hay ni un byte de imagen de marca: pesa cero y se ve nítido a cualquier
  # densidad. Los PNG de `assets/brand/derivados/` son solo para el lanzador, que
  # no admite un widget, y el lanzador no lee de aquí.
  #
  # Lo único que se empaqueta de `assets/` son las tipografías, de abajo.

  fonts:
    # La VGA va aparte y **solo para el arte ASCII**. Es una obra con licencia
    # copyleft (CC-BY-SA-4.0-Int, VileR): el crédito y las condiciones están en
    # `assets/fonts/Px437-LICENCIA.txt`, y el fichero va sin tocar, porque una
    # adaptación tendría que salir con la misma licencia.
    - family: Px437VGA
      fonts:
        - asset: assets/fonts/Px437_IBM_VGA8.ttf
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700

# `adaptive_icon_foreground_inset` no es un número decorativo, y el motivo es el
# de siempre: el lienzo del ícono adaptativo es de 108 dp y el lanzador descarta
# 18 dp por lado, así que solo sobrevive el 66% central. Con 12 la marca anterior
# se salía y la máscara circular le cortaba el cráneo. **Un número que parece de
# correctitud no se verifica solo**: 18 se comprobó renderizando la máscara del
# lanzador, y el ícono se juzga después de que el sistema la aplique, nunca sobre
# el PNG (A-024).
#
# La geometría viene de `assets/brand/derivados/aegis_mark.svg`, que es la
# misma figura que pinta la app. Si cambias el glifo, el SVG y el `CustomPaint`
# tienen que cambiar los dos, o el ícono y la app cuentan cosas distintas.
#
# El `foreground` va **sin fondo** y el negro lo pone `adaptive_icon_background`.
# Con un rect negro dentro del foreground el resultado sale igual —negro sobre
# negro— y no se ve que hay dos capas; el día que el fondo cambie, el ícono
# tendrá una caja negra que nadie pidió.
flutter_launcher_icons:
  # El nombre del fichero. El manifest apunta a `@mipmap/ic_launcher`, así que
  # esto tiene que ser exactamente eso: con otro nombre se generan los PNG y la
  # app sigue con el ícono de la plantilla.
  android: "ic_launcher"
  ios: false
  image_path: "assets/brand/derivados/aegis_mark.png"

  # `adaptive_icon_foreground` es obligatorio y no se deduce de `image_path`: sin
  # él no se genera nada adaptativo, que es justo lo que hace que Android 12+ no
  # recorte el ícono.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/brand/derivados/aegis_mark_foreground.png"
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 21
